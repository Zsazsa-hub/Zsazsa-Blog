<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Admin | Zsazsa</title>
    <link rel="stylesheet" href="/assets/css/styles.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-card">
        <p class="eyebrow">Area Admin</p>
        <h1>Masuk ke Dashboard</h1>
        <p>Kelola blog, produk, firmware, affiliate, pembayaran, dan pelanggan dari satu panel.</p>
        <form class="checkout-form">
          <div class="form-group">
            <label>Email</label>
            <input type="email" placeholder="admin@zsazsa.id" />
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" placeholder="********" />
          </div>
          <a class="btn btn-primary" href="/pages/admin.html">Masuk</a>
        </form>
      </div>
    </div>
  </body>
</html>
