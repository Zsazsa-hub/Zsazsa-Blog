<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Admin | Zsazsa</title>
    <link rel="stylesheet" href="/assets/css/styles.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-card">
        <p class="eyebrow">Area Admin</p>
        <h1>Masuk ke Dashboard Admin</h1>
        <p>Kelola blog, produk, firmware, affiliate, pembayaran, notifikasi, dan pelanggan dari satu panel.</p>
        <form id="login-form" class="checkout-form">
          <div class="form-group">
            <label>Email</label>
            <input id="email" type="email" placeholder="admin@zsazsa.id" required />
          </div>
          <div class="form-group">
            <label>Password</label>
            <input id="password" type="password" placeholder="********" required />
          </div>
          <button class="btn btn-primary" type="submit">Masuk</button>
          <p id="login-error" class="error" style="display:none;color:#b00020;margin-top:8px"></p>
        </form>
        <script>
          document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errEl = document.getElementById('login-error');
            errEl.style.display = 'none';
            try {
              const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
              });
              if (!res.ok) {
                const j = await res.json().catch(() => ({}));
                errEl.textContent = j.error || 'Gagal login';
                errEl.style.display = 'block';
                return;
              }
              const data = await res.json();
              if (data.token) {
                localStorage.setItem('zsazsa_token', data.token);
                window.location.href = '/pages/admin-dashboard.html';
              } else {
                errEl.textContent = 'Token tidak diterima';
                errEl.style.display = 'block';
              }
            } catch (e) {
              errEl.textContent = 'Kesalahan jaringan';
              errEl.style.display = 'block';
            }
          });
        </script>
      </div>
    </div>
  </body>
</html>
