<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Admin | Zsazsa</title>
    <link rel="stylesheet" href="/assets/css/styles.css" />
  </head>
  <body>
    <header class="hero compact">
      <nav class="nav">
        <a class="brand" href="/index.html">Zsazsa</a>
        <div class="nav-links">
          <a href="/pages/admin-dashboard.html">Dashboard</a>
          <a href="/pages/admin.html">Admin</a>
          <a id="nav-login" href="/pages/login.html">Login</a>
          <a id="nav-logout" href="#" style="display:none">Logout</a>
        </div>
      </nav>
      <div class="hero-content single">
        <div>
          <p class="eyebrow">Panel Admin</p>
          <h1>Ringkasan operasional bisnis digital Anda</h1>
          <p>Monitor penjualan, konten, pesanan, affiliate, pembelian, dan status sistem dari satu panel.</p>
        </div>
      </div>
    </header>

    <main class="page-grid">
      <article class="card">
        <h3>Pesanan Hari Ini</h3>
        <p>24</p>
      </article>
      <article class="card">
        <h3>Pengunjung</h3>
        <p>1.284</p>
      </article>
      <article class="card">
        <h3>Komisi Affiliate</h3>
        <p>Rp 4.800.000</p>
      </article>
    </main>
    <script>
      // Require login: check token and verify with /api/me
      (async function(){
        const token = localStorage.getItem('zsazsa_token');
        const navLogin = document.getElementById('nav-login');
        const navLogout = document.getElementById('nav-logout');
        if (!token) {
          window.location.href = '/pages/login.html';
          return;
        }
        try {
          const res = await fetch('/api/me', { headers: { 'Authorization': 'Bearer ' + token } });
          if (!res.ok) {
            localStorage.removeItem('zsazsa_token');
            window.location.href = '/pages/login.html';
            return;
          }
          const j = await res.json();
          // show logout and hide login
          if (navLogin) navLogin.style.display = 'none';
          if (navLogout) {
            navLogout.style.display = 'inline-block';
            navLogout.addEventListener('click', (e)=>{
              e.preventDefault();
              localStorage.removeItem('zsazsa_token');
              window.location.href = '/pages/login.html';
            });
          }
        } catch (e) {
          localStorage.removeItem('zsazsa_token');
          window.location.href = '/pages/login.html';
        }
      })();
    </script>
  </body>
</html>
