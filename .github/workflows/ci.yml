name: CI — Build & Publish Docker Image

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE_NAME: zsazsa-blog-web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker registry (if provided)
        if: ${{ secrets.DOCKER_USERNAME && secrets.DOCKER_PASSWORD }}
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: ${{ secrets.DOCKER_USERNAME && secrets.DOCKER_PASSWORD }}
          tags: |
            ${{ secrets.DOCKER_USERNAME && format('{0}/{1}:latest', secrets.DOCKER_USERNAME, env.IMAGE_NAME) }}
            ${{ secrets.DOCKER_USERNAME && format('{0}/{1}:${{ github.sha }}', secrets.DOCKER_USERNAME, env.IMAGE_NAME) }}

      - name: Show image tag info
        run: |
          echo "IMAGE=${{ secrets.DOCKER_USERNAME || 'local' }}/${{ env.IMAGE_NAME }}:latest"
