name: Deploy — Build, Push, and Remote Deploy

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v2
      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push frontend
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/zsazsa-blog-web:latest
  
      - name: Build and push backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/zsazsa-blog-backend:latest

  deploy-remote:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: ${{ secrets.DEPLOY_HOST && secrets.DEPLOY_USER && secrets.SSH_PRIVATE_KEY }}
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Copy compose & schema to server
        run: |
          scp -o StrictHostKeyChecking=no docker-compose.prod.yml ${ { secrets.DEPLOY_USER } }@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }} || true
          scp -o StrictHostKeyChecking=no db/schema_postgres.sql ${ { secrets.DEPLOY_USER } }@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }} || true

      - name: Remote deploy (pull & restart)
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "cd ${{ secrets.DEPLOY_PATH }} && docker compose pull && docker compose up -d && docker compose ps"

      - name: Run migrations on remote
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "cd ${{ secrets.DEPLOY_PATH }} && docker compose exec -T db psql -U zsazsa -d zsazsa -f schema_postgres.sql || true"
name: Deploy Zsazsa Blog

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Siapkan Docker
        run: docker build -t zsazsa-blog .
