version: '3.8'
services:
  web:
    build: .
    image: zsazsa-blog-web:latest
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.zsazsa-web.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.zsazsa-web.entrypoints=websecure"
      - "traefik.http.routers.zsazsa-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.zsazsa-web.loadbalancer.server.port=3000"
    ports:
      - '3000:3000'
    depends_on:
      - backend
  backend:
    build: ./backend
    image: zsazsa-blog-backend:latest
    environment:
      - DATABASE_URL=postgresql://zsazsa:changeme@db:5432/zsazsa
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.zsazsa-backend.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.zsazsa-backend.entrypoints=websecure"
      - "traefik.http.routers.zsazsa-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.zsazsa-backend.loadbalancer.server.port=4000"
    ports:
      - '4000:4000'
    depends_on:
      - db
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: zsazsa
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: zsazsa
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
